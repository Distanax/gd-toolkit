name: Build gd-bridge mod

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]          # path filters are not applied to tag pushes
    paths:
      - "mod/**"
      - ".github/workflows/build-mod.yml"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Turn compiler/linker/CMake errors into check-run annotations: those are readable through the
      # public API, unlike the raw logs, so failures can be diagnosed without signing in.
      - name: Register error matcher
        run: echo "::add-matcher::.github/build-error-matcher.json"

      # SDK version comes from mod/mod.json ("geode": "5.10.1"); the action's sdk input defaults to "given".
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: mod
          target: Win64

      - uses: actions/upload-artifact@v4
        with:
          name: gd-bridge-win
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gd-bridge-win
          path: dist

      - name: List build output
        run: ls -la dist

      # main: a rolling "latest" prerelease, recreated on the new commit so the download URL never changes:
      # https://github.com/<repo>/releases/download/latest/distanax.gd-bridge.geode
      - name: Rolling "latest" release
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.geode \
            --target "$GITHUB_SHA" --prerelease \
            --title "gd-bridge (latest main build)" \
            --notes "Automatic build of main at $GITHUB_SHA. Install guide: TESTING.md."

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.geode --verify-tag \
            --title "gd-bridge $GITHUB_REF_NAME" --notes "Install guide: TESTING.md."
